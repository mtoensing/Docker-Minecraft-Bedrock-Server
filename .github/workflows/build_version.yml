name: Build and push 

on: 
  push:
      branches:
      - 'latest'

  # Allows you to run this workflow manually from the Actions tab 
  workflow_dispatch:
    inputs:
      download_url:
        description: 'bedrock server download url (zip)'
        required: true
        default: 'https://minecraft.azureedge.net/bin-linux/bedrock-server-1.XX.XX.XX.zip'

  # Allows you to trigger this workflow from another workflow
  repository_dispatch:
    types: [build_version]

jobs:
  push_to_registries:
    name: Push Docker image to multiple registries
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: set download url
        run: echo "DOWNLOAD_URL=${{ inputs.download_url }}${{ github.event.client_payload.download_url }}" >> $GITHUB_ENV

#      - name: Log in to docker.io container registry
#        uses: docker/login-action@v3
#        with:
#          registry: docker.io
#          username: ${{ secrets.DOCKER_HUB_USERNAME }}
#          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Log in to ghcr.io container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for container image
        id: meta
        uses: docker/metadata-action@v5
        with:
          labels: |
            org.opencontainers.image.authors="Marc Tönsing <marc@marc.tv>"
          tags: |
            type=raw,value=${{ env.server_version }}
            type=raw,value=latest,enable=${{ github.event.client_payload.is_latest == 'yes' }}
#          images: |
#            docker.io/marctv/minecraft-bedrock-server
#            ghcr.io/${{ github.repository }}
          images: |
            ghcr.io/${{ github.repository }}
      
      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOWNLOAD_URL=${{ env.DOWNLOAD_URL }}
